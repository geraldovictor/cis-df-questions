name: Daily CAD and CIS-EM question search

on:
  schedule:
    # 07:17 in America/Sao_Paulo (UTC-3).
    - cron: '17 10 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/daily-question-search.yml'
      - 'scripts/question-source-watch.mjs'
      - 'tests/question-search.test.mjs'

permissions:
  contents: read

concurrency:
  group: daily-question-search
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Validate the search and existing banks
        run: node --test tests/*.test.mjs
      - name: Search public catalogs and Community RSS
        run: node scripts/question-source-watch.mjs
      - name: Save source links and comparison report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: question-search-${{ github.run_id }}
          path: test-results/question-search/
          retention-days: 30
          if-no-files-found: warn
